# Receipt printing
receipt.storage-path=./data/receipts
receipt.max-reprints=3
receipt.qr-enabled=true


spring.application.name=schoolProject

# Application metadata (health endpoint)
app.name=${APP_NAME:School Management System}

# CORS — comma-separated allowed origins (never use * with allow-credentials=true)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,Accept,X-Requested-With
app.cors.allow-credentials=true
app.cors.max-age=3600

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://3.110.2.51:3306/pradeep_testDb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tT5MpVJMRFXmBgZRWfTU}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — schema and SQL are managed by Hibernate (no manual DDL scripts)
# update: create missing tables/columns/indexes; alter when entity mappings change
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Hibernate SQL logging (disabled — use ApiLoggingFilter for API logs; enable only when debugging DB)
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# REST API request/response logging (ApiLoggingFilter)
logging.level.com.infiniteVision.schoolProject.common.filter.ApiLoggingFilter=INFO

# user_sessions.session_id remains UUID (CHAR in MySQL)
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Disable schema/data init scripts so Hibernate remains the single source of DDL
spring.sql.init.mode=never

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Auth — opaque Bearer token (128 hex chars) + Redis session (no signed JWT)
jwt.token-length=${JWT_TOKEN_LENGTH:128}
# 128 minutes (7680000 ms) — Redis session TTL
jwt.expiration-ms=${JWT_EXPIRATION_MS:7680000}
jwt.redis-prefix=${JWT_REDIS_PREFIX:session:}
