spring.application.name=schoolProject

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://3.110.2.51:3306/school_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tT5MpVJMRFXmBgZRWfTU}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — schema and SQL are managed by Hibernate (no manual DDL scripts)
# update: create missing tables/columns/indexes; alter when entity mappings change
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Log every SQL statement Hibernate executes (DDL on startup + DML at runtime)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# MySQL UUID columns (e.g. users.user_id)
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Disable schema/data init scripts so Hibernate remains the single source of DDL
spring.sql.init.mode=never

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT (single token in Redis; no access/refresh split). access-expiration-ms kept for config compatibility.
jwt.secret=${JWT_SECRET:change-me-use-at-least-32-chars-for-hs256}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}
jwt.refresh-redis-prefix=${JWT_REFRESH_REDIS_PREFIX:refresh:}
